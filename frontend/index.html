<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GridWise — LLM Energy Optimizer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
  // Stitch's "Cyber-Industrial Telemetry" palette, mapped onto CSS variables so one class set
  // renders both themes. Values are RGB triplets (see :root / .dark below).
  const v = (name) => `rgb(var(--${name}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: "class",
    theme: { extend: {
      colors: {
        background: v("surface"), surface: v("surface"),
        "surface-container-lowest": v("sc-lowest"), "surface-container-low": v("sc-low"),
        "surface-container": v("sc"), "surface-container-high": v("sc-high"),
        "surface-container-highest": v("sc-highest"),
        "on-surface": v("on-surface"), "on-surface-variant": v("on-surface-variant"),
        outline: v("outline"), "outline-variant": v("outline-variant"),
        primary: v("primary"), "primary-container": v("primary-container"),
        "on-primary-container": v("on-primary-container"),
        secondary: v("secondary"), tertiary: v("tertiary"),
        error: v("error"), "error-container": v("error-container"),
        solar: v("solar"), grid: v("grid"), battery: v("battery"), price: v("price"), pass: v("pass"), warn: v("warn"),
      },
      fontFamily: { sans: ["Inter", "sans-serif"], mono: ["JetBrains Mono", "monospace"] },
    } },
  };
</script>
<style>
  :root { /* light */
    --surface: 246 248 252; --sc-lowest: 255 255 255; --sc-low: 238 242 248; --sc: 230 235 243;
    --sc-high: 221 228 238; --sc-highest: 210 219 231; --on-surface: 15 23 42; --on-surface-variant: 71 85 105;
    --outline: 100 116 139; --outline-variant: 203 213 225; --primary: 30 91 186; --primary-container: 59 111 224;
    --on-primary-container: 255 255 255; --secondary: 13 148 136; --tertiary: 183 121 31;
    --error: 185 28 28; --error-container: 254 226 226;
    --solar: 217 142 4; --grid: 59 111 224; --battery: 13 148 136; --price: 220 38 38; --pass: 22 163 74; --warn: 234 88 12;
  }
  .dark {
    --surface: 3 20 39; --sc-lowest: 0 15 33; --sc-low: 11 28 48; --sc: 16 32 52; --sc-high: 27 43 63;
    --sc-highest: 38 54 74; --on-surface: 211 228 254; --on-surface-variant: 195 198 212; --outline: 141 144 158;
    --outline-variant: 66 71 82; --primary: 174 198 255; --primary-container: 93 142 241; --on-primary-container: 0 20 50;
    --secondary: 68 226 205; --tertiary: 249 188 68; --error: 255 180 171; --error-container: 147 0 10;
    --solar: 245 185 65; --grid: 91 141 239; --battery: 45 212 191; --price: 248 113 113; --pass: 34 197 94; --warn: 251 146 60;
  }
  html, body { margin: 0; padding: 0; }
  body { overscroll-behavior: none; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .filled { font-variation-settings: 'FILL' 1; }
  .node-active { box-shadow: 0 0 0 6px rgb(var(--primary) / .15), 0 0 28px rgb(var(--primary) / .45); }
  @keyframes pulse-line { from { background-position: 0 0; } to { background-position: 40px 0; } }
  .flow-line { background: repeating-linear-gradient(90deg, rgb(var(--primary) / .7) 0 10px, transparent 10px 20px); background-size: 40px 100%; animation: pulse-line .8s linear infinite; }
  .view { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  textarea { resize: vertical; }
</style>
</head>
<body class="bg-background text-on-surface font-sans antialiased min-h-screen">

<!-- SIDEBAR -->
<aside class="fixed left-0 top-0 h-screen w-60 bg-surface-container-lowest border-r border-outline-variant/40 z-50 flex flex-col justify-between select-none">
  <div class="p-3 flex flex-col gap-3">
    <div class="flex items-center gap-2 px-1 pb-3 border-b border-outline-variant/30">
      <span class="material-symbols-outlined filled text-secondary text-[26px]">battery_charging_full</span>
      <div class="flex flex-col leading-tight">
        <span class="font-semibold tracking-tight">GridWise</span>
        <span class="text-[10px] uppercase tracking-wider text-on-surface-variant">LLM Energy Optimizer</span>
      </div>
    </div>
    <nav id="nav" class="flex flex-col gap-1 text-sm"></nav>
  </div>
  <div class="m-3 p-2.5 rounded-lg bg-surface-container-low border border-outline-variant/40 font-mono text-[11px] flex flex-col gap-1.5">
    <div class="flex items-center gap-1.5"><span id="apiDot" class="inline-block w-2 h-2 rounded-full bg-outline"></span><span id="apiText" class="font-semibold text-on-surface-variant">API checking…</span></div>
    <div class="h-px bg-outline-variant/40"></div>
    <div class="flex justify-between gap-2"><span class="text-outline">model</span><span id="modelName" class="text-on-surface truncate">—</span></div>
    <div class="flex justify-between gap-2"><span class="text-outline">solver</span><span class="text-on-surface">HiGHS LP</span></div>
  </div>
</aside>

<!-- HEADER -->
<header class="fixed top-0 left-60 right-0 h-14 bg-surface/90 backdrop-blur border-b border-outline-variant/30 z-40 px-5 flex items-center gap-5">
  <div id="stepper" class="flex-1 max-w-2xl mx-auto flex items-center gap-2"></div>
  <button id="themeBtn" type="button" title="Toggle light / dark theme" class="shrink-0 w-9 h-9 rounded-lg border border-outline-variant/50 hover:bg-surface-container-high flex items-center justify-center">
    <span id="themeIcon" class="material-symbols-outlined text-[20px]">light_mode</span>
  </button>
</header>

<main class="pl-60 pt-14 min-h-screen">
  <div id="view" class="max-w-6xl mx-auto px-6 py-8"></div>
</main>

<script src="app.js"></script>
</body>
</html>
